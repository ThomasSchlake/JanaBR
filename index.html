<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b1020">
<title>Babys retten – für Jana</title>
<style>
  /* sichere Ränder (Notch, Dynamic Island, Home-Leiste); zum Prüfen per style.setProperty überschreibbar */
  :root { --sa-t: env(safe-area-inset-top, 0px); --sa-r: env(safe-area-inset-right, 0px); --sa-b: env(safe-area-inset-bottom, 0px); --sa-l: env(safe-area-inset-left, 0px); }
  #rand { position: fixed; visibility: hidden; pointer-events: none; padding: var(--sa-t) var(--sa-r) var(--sa-b) var(--sa-l); }
  html, body { margin: 0; height: 100%; background: #05070f; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  body { font: 600 13px/1.2 system-ui, -apple-system, "Segoe UI", sans-serif; color: #8c96b8; }
  /* touch-action vererbt sich nicht: jedes Teil einzeln, sonst zoomt Doppeltippen auf dem iPhone */
  canvas, .tasten, .tasten *, #laden { touch-action: none; }
  #leiste, #leiste button { touch-action: manipulation; }
  canvas { position: absolute; image-rendering: pixelated; image-rendering: crisp-edges; }
  #leiste { position: absolute; top: max(8px, var(--sa-t)); right: max(8px, var(--sa-r)); display: flex; gap: 6px; z-index: 3; }
  #leiste button { font: inherit; color: #f2f4fa; background: #141b33cc; border: 1px solid #2e3b66; border-radius: 8px; padding: 6px 10px; }
  .tasten { position: absolute; bottom: max(14px, var(--sa-b)); z-index: 2; }
  #stick { left: max(14px, var(--sa-l)); width: 150px; height: 150px; border-radius: 50%; box-sizing: border-box; background: #141b3380; border: 2px solid #2e3b66; }
  #knauf { position: absolute; left: 42px; top: 42px; width: 62px; height: 62px; border-radius: 50%; box-sizing: border-box; background: #2e3b66; border: 2px solid #8c96b8; pointer-events: none; }
  #stick.an #knauf { background: #f5c542; border-color: #f5c542; }
  #knoepfe { right: max(14px, var(--sa-r)); width: 150px; height: 156px; }
  .t { position: absolute; display: flex; align-items: center; justify-content: center; background: #141b33b0; border: 2px solid #2e3b66; color: #f2f4fa; font-size: 20px; }
  .t.an { background: #f5c542d0; color: #0b1020; border-color: #f5c542; }
  #knoepfe .t { width: 68px; height: 68px; border-radius: 50%; font-size: 22px; }
  #k-ok { right: 0; top: 18px; } #k-zurueck { right: 80px; top: 74px; width: 56px !important; height: 56px !important; font-size: 16px !important; }
  /* Seiten getauscht (Optionen „Stick: Rechts“ bzw. Knopf ⇄ in Klassisch): Stick rechts, Knöpfe gespiegelt links */
  .getauscht #stick { left: auto; right: max(14px, var(--sa-r)); }
  .getauscht #knoepfe { right: auto; left: max(14px, var(--sa-l)); }
  .getauscht #k-ok { right: auto; left: 0; } .getauscht #k-zurueck { right: auto; left: 80px; }
  .remaster #leiste { display: none; }
  .remaster:not(.spielt) .tasten { display: none; }
  #messen { position: fixed; left: max(6px, var(--sa-l)); top: max(4px, var(--sa-t)); z-index: 5; font: 600 11px/1.3 ui-monospace, monospace; color: #62d67a; background: #05070fd0; padding: 2px 5px; border-radius: 4px; pointer-events: none; white-space: pre; }
  #laden { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #f5c542; font-size: 18px; }
</style>
</head>
<body>
<div id="rand"></div>
<div id="laden">Lädt …</div>
<canvas id="bild"></canvas>
<div id="leiste"><button id="seiten" type="button">⇄</button><button id="art" type="button">Remaster</button></div>
<div class="tasten" id="stick"><div id="knauf"></div></div>
<div class="tasten" id="knoepfe">
  <div class="t" id="k-ok" data-t="ok">OK</div><div class="t" id="k-zurueck" data-t="zurueck">✕</div>
</div>
<script>// Babys retten im Browser: dieselbe Übertragung wie ..\classic (C#), hier in JavaScript, für Handy und PC.
// Java-Rechenregeln: Ganzzahl-Division div(), Java-byte sb() (läuft über), >>> wie in Java, java.util.Random mit BigInt.
// Geprüft wie die C#-Fassung: pruefen.js lässt diesen Code ohne Browser gegen referenz\ (Java-Original) laufen.
"use strict";
var BR = (function () {
  const div = (a, b) => (a / b) | 0;
  const sb = (x) => (x << 24) >> 24;

  // ------------------------------------------------------------------ PNG lesen (8 Bit, ohne Zeilensprung)
  async function pngLesen(d, inflate) {
    let i = 8, b = 0, h = 0, tiefe = 0, typ = 0, il = 0, palette = null, trns = null;
    const teile = [];
    const u32 = (p) => ((d[p] << 24) | (d[p + 1] << 16) | (d[p + 2] << 8) | d[p + 3]) >>> 0;
    while (i < d.length) {
      const n = u32(i), t = String.fromCharCode(d[i + 4], d[i + 5], d[i + 6], d[i + 7]), p = i + 8;
      if (t === "IHDR") { b = u32(p); h = u32(p + 4); tiefe = d[p + 8]; typ = d[p + 9]; il = d[p + 12]; }
      else if (t === "PLTE") { palette = []; for (let k = 0; k < n / 3; k++) palette.push(((d[p + 3 * k] << 16) | (d[p + 3 * k + 1] << 8) | d[p + 3 * k + 2]) >>> 0); }
      else if (t === "tRNS") trns = d.slice(p, p + n);
      else if (t === "IDAT") teile.push(d.slice(p, p + n));
      else if (t === "IEND") break;
      i += 12 + n;
    }
    if (tiefe !== 8 || il !== 0) throw new Error("PNG nicht unterstützt");
    const kan = { 0: 1, 2: 3, 3: 1, 4: 2, 6: 4 }[typ];
    let len = 0; for (const t of teile) len += t.length;
    const z = new Uint8Array(len); let o = 0; for (const t of teile) { z.set(t, o); o += t.length; }
    const roh = await inflate(z);
    const zeile = b * kan, bild = new Uint8Array(zeile * h);
    for (let y = 0; y < h; y++) {
      const f = roh[y * (zeile + 1)], q = y * (zeile + 1) + 1, ob = y * zeile;
      for (let x = 0; x < zeile; x++) {
        const a = x >= kan ? bild[ob + x - kan] : 0, c = y > 0 ? bild[ob - zeile + x] : 0, ac = y > 0 && x >= kan ? bild[ob - zeile + x - kan] : 0;
        let v = roh[q + x];
        if (f === 1) v += a; else if (f === 2) v += c; else if (f === 3) v += (a + c) >> 1;
        else if (f === 4) { const pp = a + c - ac, pa = Math.abs(pp - a), pb = Math.abs(pp - c), pc = Math.abs(pp - ac); v += pa <= pb && pa <= pc ? a : pb <= pc ? c : ac; }
        bild[ob + x] = v & 255;
      }
    }
    const px = new Uint32Array(b * h);
    for (let k = 0; k < px.length; k++) {
      const q = k * kan;
      if (typ === 0) px[k] = (0xFF000000 | (bild[q] * 0x010101)) >>> 0;
      else if (typ === 2) px[k] = (0xFF000000 | (bild[q] << 16) | (bild[q + 1] << 8) | bild[q + 2]) >>> 0;
      else if (typ === 3) { const ix = bild[q]; px[k] = ((palette[ix] & 0xFFFFFF) | ((trns && ix < trns.length ? trns[ix] : 255) << 24)) >>> 0; }
      else if (typ === 4) px[k] = ((bild[q + 1] << 24) | (bild[q] * 0x010101)) >>> 0;
      else px[k] = ((bild[q + 3] << 24) | (bild[q] << 16) | (bild[q + 1] << 8) | bild[q + 2]) >>> 0;
    }
    return { b, h, px };
  }

  // ------------------------------------------------------------------ MIDP-Nachbau (wie Gemeinsam\Midp.cs)
  const Anker = { HCENTER: 1, VCENTER: 2, LEFT: 4, RIGHT: 8, TOP: 16, BOTTOM: 32, BASELINE: 64 };
  const bilder = {}, texte = {};

  class Image {
    constructor(b, h, px) { this.Breite = b; this.Hoehe = h; this.Pixel = px; }
    getWidth() { return this.Breite; }
    getHeight() { return this.Hoehe; }
    static createImage(a, h) {
      if (typeof a === "string") { const q = bilder[a.replace(/^\//, "")]; return new Image(q.b, q.h, q.px); }
      const p = new Uint32Array(a * h); p.fill(0xFFFFFFFF); return new Image(a, h, p);
    }
    getGraphics() { return new Graphics(this); }
  }

  class Font {
    constructor(name) {
      const q = bilder[name + ".png"];
      this.deckung = new Uint8Array(q.px.length);
      for (let i = 0; i < q.px.length; i++) this.deckung[i] = (q.px[i] >>> 16) & 255;
      const z = texte[name + ".txt"].trim().split(/\r?\n/), kopf = z[0].split(" ");
      this.hoehe = +kopf[1]; this.grundlinie = +kopf[3];
      this.breite = new Int32Array(256);
      for (let k = 1; k < z.length; k++) { const w = z[k].split(" "); this.breite[+w[0]] = +w[1]; }
    }
    static getFont(face, style, size) { return Font.laden("schrift-" + face + "-" + style + "-" + size); }
    static getDefaultFont() { return Font.laden("standard"); }
    static laden(n) { return (Font.cache[n] ||= new Font(n)); }
    getHeight() { return this.hoehe; }
    getBaselinePosition() { return this.grundlinie; }
    static zeichen(c) { const k = c.charCodeAt(0); return k < 256 ? k : 63; }
    stringWidth(s) { let w = 0; for (const c of s) w += this.breite[Font.zeichen(c)]; return w; }
    zeichnen(g, c, x, y, farbe) {
      const z = Font.zeichen(c), zx = (z % 16) * 32, zy = div(z, 16) * 32;
      for (let yy = 0; yy < 32; yy++) {
        const zeile = (zy + yy) * 512 + zx;
        for (let xx = 0; xx < 32; xx++) { const d = this.deckung[zeile + xx]; if (d) g.mischen(x + xx - 4, y + yy - 4, farbe, d); }
      }
      return this.breite[z];
    }
  }
  Font.cache = {};
  Font.FACE_SYSTEM = 0; Font.STYLE_BOLD = 1; Font.SIZE_SMALL = 8;

  const mul = (a, b) => div(a * b + 127, 255);

  class Graphics {
    constructor(ziel) { this.z = ziel; this.tx = 0; this.ty = 0; this.kx = 0; this.ky = 0; this.kb = ziel.Breite; this.kh = ziel.Hoehe; this.farbe = 0xFF000000; this.font = Font.getDefaultFont(); }
    translate(x, y) { this.tx += x; this.ty += y; }
    setClip(x, y, b, h) { this.kx = x + this.tx; this.ky = y + this.ty; this.kb = b; this.kh = h; }
    setColor(r, g, b) { this.farbe = g === undefined ? (0xFF000000 | (r & 0xFFFFFF)) >>> 0 : (0xFF000000 | ((r & 255) << 16) | ((g & 255) << 8) | (b & 255)) >>> 0; }
    setFont(f) { this.font = f || Font.getDefaultFont(); }
    drin(x, y) { return x >= this.kx && y >= this.ky && x < this.kx + this.kb && y < this.ky + this.kh && x >= 0 && y >= 0 && x < this.z.Breite && y < this.z.Hoehe; }
    mischen(x, y, c, d) {
      if (!this.drin(x, y)) return;
      const i = y * this.z.Breite + x;
      if (d === 255) { this.z.Pixel[i] = c; return; }
      const a = this.z.Pixel[i];
      const r = mul((c >>> 16) & 255, d) + mul((a >>> 16) & 255, 255 - d), gg = mul((c >>> 8) & 255, d) + mul((a >>> 8) & 255, 255 - d), bb = mul(c & 255, d) + mul(a & 255, 255 - d);
      this.z.Pixel[i] = (0xFF000000 | (r << 16) | (gg << 8) | bb) >>> 0;
    }
    fillRect(x, y, b, h) {
      if (b <= 0 || h <= 0) return;
      x += this.tx; y += this.ty;
      const x0 = Math.max(x, this.kx, 0), y0 = Math.max(y, this.ky, 0), x1 = Math.min(x + b, this.kx + this.kb, this.z.Breite), y1 = Math.min(y + h, this.ky + this.kh, this.z.Hoehe);
      for (let yy = y0; yy < y1; yy++) this.z.Pixel.fill(this.farbe, yy * this.z.Breite + x0, yy * this.z.Breite + Math.max(x0, x1));
    }
    drawRect(x, y, b, h) {
      if (b < 0 || h < 0) return;
      x += this.tx; y += this.ty;
      const s = (xx, yy) => { if (this.drin(xx, yy)) this.z.Pixel[yy * this.z.Breite + xx] = this.farbe; };
      for (let i = 0; i <= b; i++) { s(x + i, y); s(x + i, y + h); }
      for (let i = 0; i <= h; i++) { s(x, y + i); s(x + b, y + i); }
    }
    drawImage(img, x, y, anker) {
      if (!anker) anker = Anker.TOP | Anker.LEFT;
      if (anker & Anker.HCENTER) x -= div(img.Breite, 2); else if (anker & Anker.RIGHT) x -= img.Breite;
      if (anker & Anker.VCENTER) y -= div(img.Hoehe, 2); else if (anker & Anker.BOTTOM) y -= img.Hoehe;
      x += this.tx; y += this.ty;
      const Z = this.z;
      const x0 = Math.max(x, this.kx, 0), y0 = Math.max(y, this.ky, 0), x1 = Math.min(x + img.Breite, this.kx + this.kb, Z.Breite), y1 = Math.min(y + img.Hoehe, this.ky + this.kh, Z.Hoehe);
      for (let yy = y0; yy < y1; yy++) {
        const q = (yy - y) * img.Breite - x, zz = yy * Z.Breite;
        for (let xx = x0; xx < x1; xx++) {
          const p = img.Pixel[q + xx], a = p >>> 24;
          if (a === 255) Z.Pixel[zz + xx] = p; else if (a) this.mischen(xx, yy, (p | 0xFF000000) >>> 0, a);
        }
      }
    }
    drawString(s, x, y, anker) {
      if (!anker) anker = Anker.TOP | Anker.LEFT;
      const w = this.font.stringWidth(s);
      if (anker & Anker.HCENTER) x -= div(w, 2); else if (anker & Anker.RIGHT) x -= w;
      if (anker & Anker.BASELINE) y -= this.font.getBaselinePosition(); else if (anker & Anker.BOTTOM) y -= this.font.getHeight();
      x += this.tx; y += this.ty;
      for (const c of s) x += this.font.zeichnen(this, c, x, y, this.farbe);
    }
  }

  class JavaRandom {
    constructor(s) { this.seed = (BigInt(s) ^ 0x5DEECE66Dn) & 0xFFFFFFFFFFFFn; }
    nextInt() { this.seed = (this.seed * 0x5DEECE66Dn + 0xBn) & 0xFFFFFFFFFFFFn; return Number(BigInt.asIntN(32, this.seed >> 16n)); }
  }

  const Speicher = {
    werte: null, schluessel: "babys-retten-optionen",
    alle() { if (!this.werte) { try { this.werte = JSON.parse(localStorage.getItem(this.schluessel) || "{}"); } catch (e) { this.werte = {}; } } return this.werte; },
    da(n) { return n in this.alle(); },
    lesen(n) { return this.alle()[n] | 0; },
    schreiben(n, w) { this.alle()[n] = w; try { localStorage.setItem(this.schluessel, JSON.stringify(this.werte)); } catch (e) { } },
  };

  // ------------------------------------------------------------------ das Spiel (wie classic\Spiel.cs und Level.cs)
  const Ac = {
    beendet: false, jana: false, remaster: false, dankeZeit: 0, startwert: null,
    up: false, down: false, left: false, right: false, fire: false, anyKey: false, lsk: false, rsk: false,
    UP: 1, DOWN: 6, LEFT: 2, RIGHT: 5, FIRE: 8, KEY_NUM3: 51, KEYCODE_LSK: -6,
    getGameAction(k) {
      if (k === -1 || k === 50) return 1; if (k === -2 || k === 56) return 6; if (k === -3 || k === 52) return 2;
      if (k === -4 || k === 54) return 5; if (k === -5 || k === 53) return 8; return 0;
    },
    keyPressed(k) {
      Ac.anyKey = true;
      if (k === Ac.KEYCODE_LSK) Ac.lsk = true;
      switch (Ac.getGameAction(k)) { case 1: Ac.up = true; break; case 6: Ac.down = true; break; case 2: Ac.left = true; break; case 5: Ac.right = true; break; case 8: Ac.fire = true; break; }
      if (k === Ac.KEY_NUM3) Game.GAMESTATE[0] = Game.MENU;
    },
    keyReleased(k) {
      Ac.anyKey = false;
      if (k === Ac.KEYCODE_LSK) Ac.lsk = false;
      switch (Ac.getGameAction(k)) { case 1: Ac.up = false; break; case 6: Ac.down = false; break; case 2: Ac.left = false; break; case 5: Ac.right = false; break; case 8: Ac.fire = false; break; }
    },
    drawSK(l, r, g) {
      g.setFont(Tb.font);
      const y = Tb.h - Tb.font.getHeight(), w = Tb.font.stringWidth(r);
      g.drawString(l, 5, y, Tb.anchor); g.drawString(r, Tb.w - 5 - w, y, Tb.anchor);
    },
    startPreloader: false,
    paint(g) {
      if (!Tb.preloaderReady) {
        Tb.drawOutlineString("Bitte warten.", div(Tb.w, 2), div(Tb.h, 2), Tb.anchorM, Tb.font, g);
        if (Ac.startPreloader) { Tb.preloader(); if (Ac.startwert !== null) Tb.random = new JavaRandom(Ac.startwert); }
        Ac.startPreloader = true;
      } else Game.drawGame(g);
    },
  };

  const Tb = {
    w: 240, h: 320, anchor: 20, anchorM: 17, random: null, font: null, fontH: 0, preloaderReady: false, img: null,
    actorPNG: 0, absorberPNG: 1, scionPNG: 2, tilesPNG: 3, explosionPNG: 4, bonusPNG: 5, timer: 0,
    preloader() {
      Tb.font = Font.getFont(0, 1, 8); Tb.fontH = Tb.font.getHeight();
      Tb.random = new JavaRandom(Date.now() ^ Math.floor(Math.random() * 1e9));
      Tb.loadImages(); Level.createBackground(); Options.Load(); Tb.preloaderReady = true;
    },
    loadImages() { Tb.img = ["actor", "absorber", "scion", "tiles_32x32", "explosion", "bonus"].map((n) => Image.createImage("/" + n + ".png")); },
    checkCollision(x1, y1, x2, y2, x3, y3, x4, y4) { return x2 >= x3 && x4 >= x1 && y2 >= y3 && y4 >= y1; },
    checkColRect(x1, y1, w1, h1, x3, y3, w2, h2) { return Tb.checkCollision(x1, y1, x1 + w1, y1 + h1, x3, y3, x3 + w2, y3 + h2); },
    checkColRectTol(x1, y1, w1, h1, x3, y3, w2, h2, tol) {
      x3 = x3 + div(tol, 2); y3 = y3 + div(tol, 2); w2 = w2 - tol; h2 = h2 - tol;
      return Tb.checkCollision(x1, y1, x1 + w1, y1 + h1, x3, y3, x3 + w2, y3 + h2);
    },
    drawOutlineString(s, x, y, a, f, g) {
      g.setFont(f); g.setColor(0x000000);
      g.drawString(s, x + 1, y, a); g.drawString(s, x, y + 1, a); g.drawString(s, x - 1, y, a); g.drawString(s, x, y - 1, a);
      g.setColor(0xFFFFFF); g.drawString(s, x, y, a);
    },
    pumpTimer() { Tb.timer = sb(Tb.timer + 1); if (Tb.timer > 127) Tb.timer = 0; },
    getFrame(frame, min, max, step) {
      if (frame < min || frame > max) frame = min;
      if (step < 1) step = 1;
      if (Tb.timer % step === 0) { frame = sb(frame + 1); if (frame > max) frame = min; }
      return frame;
    },
    plotFrame(image, width, height, frame, x, y, g) {
      g.setClip(x, y, width, height);
      g.drawImage(Tb.img[image], x - frame * width, y, Tb.anchor);
      g.setClip(-Actor.xt, -Actor.yt, Tb.w, Tb.h);
    },
    getRnd(grenze) { return (Tb.random.nextInt() >>> 1) % (grenze + 1); },
    clearScreen(c, g) { g.setColor(c); g.fillRect(0, 0, Tb.w, Tb.h); },
  };

  const Preloader = {
    drawGauche(g, loaded, max) {
      if (loaded >= max) loaded = max;
      const W = Tb.w - 20, Y = Tb.h - 20, percent = div(loaded * 100, max), L = div(percent * W, 100);
      g.drawRect(div(Tb.w, 2) - div(W, 2) - 2, Y - 2, W + 3, 5 + 3);
      g.fillRect(div(Tb.w, 2) - div(W, 2), Y, L, 5);
    },
  };

  const SCION = 1, ABSORBER = 2, OUT = -999999999;
  class Sprite {
    constructor() { this.type = -1; this.img = 0; this.frameAnz = 1; this.x = 0; this.y = 0; this.w = 0; this.h = 0; this.speed = 0; this.hit = false; this.dir = 0; this.frame = 0; this.min = 0; this.max = 0; this.step = 3; this.eventFrame = 0; this.drawAlways = false; }
  }
  class Actor extends Sprite {
    constructor() { super(); this.score = 0; this.type = 0; this.img = Tb.actorPNG; this.frameAnz = 16; this.min = 1; this.max = 1; this.step = 3; this.speed = 3; SpriteTool.setDim(this); }
    init() { this.score = 0; }
    draw(g) { SpriteTool.putOnScreen(this, g); }
    move() {
      const b = () => Level.checkBorderTiles(this) || Level.checksemiBorderTiles(this);
      if (Ac.left) { this.x -= this.speed; this.min = 8; this.max = 11; if (b()) this.x += this.speed; }
      if (Ac.right) { this.x += this.speed; this.min = 12; this.max = 15; if (b()) this.x -= this.speed; }
      if (Ac.up) { this.y -= this.speed; this.min = 4; this.max = 7; if (b()) this.y += this.speed; }
      if (Ac.down) { this.y += this.speed; this.min = 0; this.max = 3; if (b()) this.y -= this.speed; }
      if (!Ac.left && !Ac.right && !Ac.up && !Ac.down) {
        if (this.min === 8) { this.min = 9; this.max = 9; }
        if (this.min === 12) { this.min = 13; this.max = 13; }
        if (this.min === 4) { this.min = 5; this.max = 5; }
        if (this.min === 0) { this.min = 1; this.max = 1; }
      }
      if (Level.getTile(this) === Level.BONUS_ITEM) { this.score += 150; Level.clearTile(this); }
    }

  Actor.xt = 0; Actor.yt = 0;
  class Scion extends Sprite {

  class Absorber extends Sprite {
    constructor() { super(); this.moveType = 0; this.type = ABSORBER; this.img = Tb.absorberPNG; this.frameAnz = 4; this.speed = 1; SpriteTool.setDim(this); this.init(); }

  const SpriteTool = {
    setDim(s) { s.w = div(Tb.img[s.img].getWidth(), s.frameAnz); s.h = Tb.img[s.img].getHeight(); },
    move(s, t) { if (t === 0) { if (!s.hit) SpriteTool.moveRnd(s); } else if (t === 1) { if (!s.hit) SpriteTool.followActor(s); } },
    moveRnd(s) {

    },
    moveAndCheckBorders(s) {

    pruefen(sp, x, y) {

// tipp/handyTipp: auch ein Druck, der kürzer als ein Bild (40 ms) ist, zählt für ein Bild
const gehalten = new Set(), handy = new Set(), tipp = new Set(), handyTipp = new Set();
const TASTEN = { ArrowUp: "hoch", ArrowDown: "runter", ArrowLeft: "links", ArrowRight: "rechts", KeyW: "hoch", KeyS: "runter", KeyA: "links", KeyD: "rechts",
  Numpad8: "hoch", Numpad2: "runter", Numpad4: "links", Numpad6: "rechts", Enter: "ok", Space: "ok", Numpad5: "ok", Escape: "zurueck", Backspace: "zurueck", KeyP: "pause" };
// Klassisch zusätzlich wie FreeJ2ME: Q/W Softtasten, Ziffern, E = *, R = #
const HANDY = { KeyQ: -6, KeyE: 42, KeyR: 35 };
for (let i = 0; i <= 9; i++) { HANDY["Digit" + i] = 48 + i; if (i !== 2 && i !== 4 && i !== 5 && i !== 6 && i !== 8) HANDY["Numpad" + i] = 48 + i; }
addEventListener("keydown", (e) => {
  if (e.repeat) { e.preventDefault(); return; }
  const t = TASTEN[e.code];
  if (t) { gehalten.add(t); tipp.add(t); if (t === "zurueck" && e.code === "Escape") { gehalten.add("pause"); tipp.add("pause"); } e.preventDefault(); }
  if (klassisch && HANDY[e.code] !== undefined) { handy.add(HANDY[e.code]); handyTipp.add(HANDY[e.code]); e.preventDefault(); }
});
addEventListener("keyup", (e) => {
  const t = TASTEN[e.code];
  if (t) { gehalten.delete(t); if (e.code === "Escape") gehalten.delete("pause"); }
  if (HANDY[e.code] !== undefined) handy.delete(HANDY[e.code]);
});
addEventListener("blur", () => { gehalten.clear(); handy.clear(); });

// Kein Zoomen (Thomas, 22.11.2026: Doppeltippen zoomte auf dem iPhone hinein, Stick und Knöpfe waren weg, heraus ging
// es nicht mehr). iOS überhört user-scalable=no. Deshalb fängt die Seite die Touch-Ereignisse selbst ab: Hier gibt es
// nichts zu schieben oder zu zoomen; Stick, Knöpfe und Antippen laufen über Pointer-Ereignisse und kommen weiter an.
// Nur die zwei Knöpfe der Leiste (Klassisch) brauchen ihren Klick und bleiben ausgenommen.
const keinZoom = (e) => { if (e.cancelable && !(e.target && e.target.closest && e.target.closest("#leiste"))) e.preventDefault(); };
for (const n of ["touchstart", "touchmove", "touchend"]) addEventListener(n, keinZoom, { passive: false });
for (const n of ["gesturestart", "gesturechange", "gestureend", "dblclick"]) addEventListener(n, (e) => e.preventDefault(), { passive: false });
// Ist doch hineingezoomt (Bedienungshilfen, alte Seite im Zwischenspeicher): die Ansicht zurücksetzen, höchstens einmal je Sekunde
if (typeof visualViewport !== "undefined" && document.querySelector) {
  let zuletzt = 0;
  visualViewport.addEventListener("resize", () => {
    if (visualViewport.scale <= 1.01 || performance.now() - zuletzt < 1000) return;
    zuletzt = performance.now();
    const m = document.querySelector('meta[name="viewport"]'), c = m.content;
    m.content = "width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, viewport-fit=cover";
    requestAnimationFrame(() => { m.content = c; });
  });
}
for (const k of document.querySelectorAll(".t")) {
  const t = k.dataset.t;
  const an = (e) => { e.preventDefault(); k.setPointerCapture?.(e.pointerId); k.classList.add("an"); gehalten.add(t); tipp.add(t); if (t === "zurueck") { gehalten.add("pause"); tipp.add("pause"); } };
  const aus = () => { k.classList.remove("an"); gehalten.delete(t); if (t === "zurueck") gehalten.delete("pause"); };
  k.addEventListener("pointerdown", an); k.addEventListener("pointerup", aus); k.addEventListener("pointercancel", aus); k.addEventListener("lostpointercapture", aus);
}

// Steuerstick: Richtung aus dem Winkel (8 Richtungen, schräg = zwei Tasten), kleine Bewegungen zählen nicht
const stick = document.getElementById("stick"), knauf = document.getElementById("knauf");
let stickId = null, stickRichtung = new Set();
function stickStellen(dx, dy) {
  const d = Math.hypot(dx, dy), k = d > 44 ? 44 / d : 1, neu = new Set();
  knauf.style.transform = "translate(" + dx * k + "px," + dy * k + "px)";
  if (d > 16) {
    if (dx < -d * 0.38) neu.add("links"); if (dx > d * 0.38) neu.add("rechts");
    if (dy < -d * 0.38) neu.add("hoch"); if (dy > d * 0.38) neu.add("runter");
  }
  for (const t of neu) if (!stickRichtung.has(t)) { gehalten.add(t); tipp.add(t); }
  for (const t of stickRichtung) if (!neu.has(t)) gehalten.delete(t);
  stickRichtung = neu; stick.classList.toggle("an", neu.size > 0);
}
const stickZiehen = (e) => { if (e.pointerId !== stickId) return; e.preventDefault(); const r = stick.getBoundingClientRect(); stickStellen(e.clientX - r.left - r.width / 2, e.clientY - r.top - r.height / 2); };
const stickLos = (e) => { if (e.pointerId !== stickId) return; stickId = null; stickStellen(0, 0); };
stick.addEventListener("pointerdown", (e) => { e.preventDefault(); stickId = e.pointerId; stick.setPointerCapture?.(e.pointerId); stickZiehen(e); });
stick.addEventListener("pointermove", stickZiehen);
stick.addEventListener("pointerup", stickLos); stick.addEventListener("pointercancel", stickLos); stick.addEventListener("lostpointercapture", stickLos);

const leinwand = document.getElementById("bild"), ctx = leinwand.getContext("2d");
let remaster = null;   // die Handy-Oberfläche, solange nicht Klassisch

// Antippen im Remaster: Punkte in Bühnen-Koordinaten; überall außer auf den Tasten
let tippsNeu = [], halten = null, haltId = null;
const punkt = (e) => { const r = leinwand.getBoundingClientRect(); return { x: Math.floor((e.clientX - r.left) * leinwand.width / r.width), y: Math.floor((e.clientY - r.top) * leinwand.height / r.height) }; };
addEventListener("pointerdown", (e) => {
  if (klassisch || e.target.closest(".tasten, #leiste")) return;
  e.preventDefault(); const p = punkt(e); tippsNeu.push(p); halten = p; haltId = e.pointerId;
});
addEventListener("pointermove", (e) => { if (e.pointerId === haltId && halten) halten = punkt(e); });
const loslassen = (e) => { if (e.pointerId === haltId) { halten = null; haltId = null; } };
addEventListener("pointerup", loslassen); addEventListener("pointercancel", loslassen);

function groesse() {
  const b = innerWidth, h = innerHeight;
  const rs = getComputedStyle(document.getElementById("rand")), px = (n) => parseFloat(rs["padding" + n]) || 0;
  const T = px("Top"), R = px("Right"), U = px("Bottom"), L = px("Left");
  const fuss = Math.max(14, U) + 150 + 10;   // Stick/Knöpfe unten (150 px hoch) mit Abstand wie im CSS
  const seiteFrei = Math.max(Math.max(14, L) + 150, Math.max(14, R) + 150) + 10;
  let W, H, f, links, oben;
  if (h > b) {
    // hochkant: Bühne 240x360 (Remaster) bzw. 240x320 (Klassisch), unten Platz für Stick und Knöpfe,
    // oben für Notch/Insel und in Klassisch für die Leiste (auch wenn die Tasten im Menü ausgeblendet sind, damit nichts springt)
    W = 240; H = klassisch ? 320 : 360;
    const kopf = T + (klassisch ? 44 : 6);
    f = Math.min((b - L - R) / W, (h - kopf - fuss) / H);
    links = Math.round((b - W * f) / 2); oben = kopf + Math.max(0, Math.round((h - kopf - fuss - H * f) / 2));
  } else if (klassisch) {
    // quer, Klassisch: das Handybild in der Mitte, Stick und Knöpfe links und rechts daneben
    W = 240; H = 320;
    f = Math.min((b - 2 * seiteFrei) / W, (h - T - U - 8) / H);
    links = Math.round((b - W * f) / 2); oben = T + Math.round((h - T - U - H * f) / 2);
  } else {
    // quer, Remaster: eigene Anordnung über die ganze sichere Fläche; Bühne Bx320, so breit wie das Seitenverhältnis,
    // aber mindestens so breit, dass Stick und Knöpfe unter den Seitentafeln neben dem Spielfeld Platz haben
    H = 320;
    const fb = b - L - R, fh = h - T - U, f0 = fh / H;
    // (wird die Bühne dafür breiter als das Seitenverhältnis, schrumpft der Maßstab; daher W ≥ 240·fb/(fb − 2·seiteFrei))
    const mindest = fb > 2 * seiteFrei ? Math.ceil(240 * fb / (fb - 2 * seiteFrei)) : 240 + 2 * Math.ceil(seiteFrei / f0);
    W = 2 * Math.ceil(Math.max(Math.round(fb / f0), mindest, 240 + 2 * Math.ceil(seiteFrei / f0), 400) / 2);
    f = Math.min(fb / W, fh / H);
    links = L + Math.round((fb - W * f) / 2); oben = T + Math.round((fh - H * f) / 2);
  }
  if (remaster) { remaster.anpassen(W, H); }
  if (leinwand.width !== W || leinwand.height !== H) { leinwand.width = W; leinwand.height = H; }
  leinwand.style.width = Math.round(W * f) + "px"; leinwand.style.height = Math.round(H * f) + "px";
  leinwand.style.left = links + "px"; leinwand.style.top = oben + "px";
}
addEventListener("resize", groesse);
addEventListener("orientationchange", () => setTimeout(groesse, 300));

// Pixel (0xAARRGGBB) ins Canvas; ein Bildpuffer je Größe, geschrieben als 32-Bit-Wörter (RGBA im Speicher, Little Endian)
let bildDaten = null, bild32 = null, bildW = 0, bildH = 0;
function zeigen(px, W, H) {
  if (!bildDaten || bildW !== W || bildH !== H) { bildDaten = ctx.createImageData(W, H); bild32 = new Uint32Array(bildDaten.data.buffer); bildW = W; bildH = H; }
  for (let i = 0; i < px.length; i++) { const p = px[i]; bild32[i] = (0xFF000000 | ((p & 0xFF) << 16) | (p & 0xFF00) | ((p >>> 16) & 0xFF)) >>> 0; }
  ctx.putImageData(bildDaten, 0, 0);
}

(async () => {
  const dateien = {};
  for (const [n, d] of Object.entries(DATEIEN)) dateien[n] = n.endsWith(".png") ? roh(d) : d;
  await BR.laden(dateien, inflate);
  document.getElementById("laden").remove();
  let schritt;
  if (klassisch) {
    // wie Gemeinsam\Fenster.cs HandyAnzeige: je Taste ein keyPressed beim Drücken, ein keyReleased beim Loslassen
    BR.Tb.w = 240; BR.Tb.h = 320;
    const schirm = BR.Image.createImage(240, 320), CODE = { hoch: -1, runter: -2, links: -3, rechts: -4, ok: -5, zurueck: 51 };
    let vorher = new Set();
    schritt = (letzter) => {
      const jetzt = new Set([...handy, ...handyTipp]);
      for (const t of [...gehalten, ...tipp]) if (CODE[t] !== undefined) jetzt.add(CODE[t]);
      tipp.clear(); handyTipp.clear();
      for (const c of vorher) if (!jetzt.has(c)) BR.Ac.keyReleased(c);
      for (const c of jetzt) if (!vorher.has(c)) BR.Ac.keyPressed(c);
      vorher = jetzt;
      try { BR.Ac.paint(schirm.getGraphics()); } catch (e) { }
      if (BR.Ac.beendet) { BR.Ac.beendet = false; location.hash = ""; location.reload(); }   // „Verlassen“: zurück ins Remaster
      if (letzter) zeigen(schirm.Pixel, 240, 320);
    };
  } else {
    BR.Ac.remaster = true;
    document.body.classList.add("remaster");
    const r = remaster = new BRHandy({ klassisch: () => { location.hash = "#klassisch"; location.reload(); }, seite: () => seite, seiteSetzen });
    // Holt der Takt Bilder nach, werden sie nur gerechnet; gemalt und gezeigt wird das letzte
    schritt = (letzter) => {
      BRRetro.malen(letzter);
      r.schritt(new Set([...gehalten, ...tipp]), tippsNeu, halten); tipp.clear(); tippsNeu = [];
      if (!letzter) return;
      document.body.classList.toggle("spielt", r.schirm === "Spiel");
      zeigen(r.buehne.Pixel, r.B, r.H);
    };
  }
  groesse();
  // Klassisch 25 Bilder/s wie das Handyspiel, das Remaster 60 Bilder/s (die Logik darin weiter 25 Schritte/s), auch wenn
  // der Bildschirm schneller ist; 1 ms Spielraum, damit ein 60-Hz-Bildschirm nicht wegen Zeitschwankungen ein Bild auslässt
  const MS = klassisch ? 40 : 1000 / 60;
  // Messanzeige (Adresse mit ?messen): Bildschirmtakt, gerechnete und gezeigte Bilder je Sekunde, Rechenzeit je Takt
  const messen = /[?&]messen\b/.test(location.search) ? document.body.appendChild(Object.assign(document.createElement("div"), { id: "messen" })) : null;
  let mTakte = 0, mSchritte = 0, mGezeigt = 0, mMs = 0, mMax = 0, mSeit = performance.now();
  let zeit = performance.now();
  (function takt(jetzt) {
    let n = 0;
    while (jetzt - zeit >= MS - 1 && n < 5) { zeit += MS; n++; }
    if (jetzt - zeit > 200) zeit = jetzt;
    const t0 = messen ? performance.now() : 0;
    for (let i = 0; i < n; i++) schritt(i === n - 1);
    if (messen) {
      const d = performance.now() - t0;
      mTakte++; mSchritte += n; if (n) { mGezeigt++; mMs += d; mMax = Math.max(mMax, d); }
      if (jetzt - mSeit >= 1000) {
        const s = (jetzt - mSeit) / 1000;
        messen.textContent = Math.round(mTakte / s) + " Hz  " + Math.round(mGezeigt / s) + " gezeigt  " + Math.round(mSchritte / s) + " gerechnet\n"
          + (mGezeigt ? (mMs / mGezeigt).toFixed(1) : "0") + " ms  max " + mMax.toFixed(0) + " ms  " + leinwand.width + "x" + leinwand.height;
        mTakte = mSchritte = mGezeigt = mMs = mMax = 0; mSeit = jetzt;
      }
    }
    requestAnimationFrame(takt);
  })(zeit);
})();
</script>
</body>
</html>
